# ---------------------------------------------------------------------------
# edge-captura : painel de estado da quadra (simula o mini-PC da Kovenza)
# ---------------------------------------------------------------------------
server {
    # 8080 e a porta liberada pela regra R1 para a rede da arena.
    listen 8080;
    server_name edge-captura;

    root /usr/share/nginx/html;

    # Endpoint que o dono da arena consulta para saber se a quadra transmite.
    location /health {
        default_type application/json;
        alias /usr/share/nginx/html/health.json;
    }

    location / {
        default_type text/plain;
        return 200 "edge-captura (mini-PC Kovenza) - use /health\n";
    }
}
