# ---------------------------------------------------------------------------
# nuvem-supabase : API do Supabase simulada, somente HTTPS
# ---------------------------------------------------------------------------
server {
    # 443 e a porta liberada pela regra R4 para o edge-captura.
    listen 443 ssl;
    server_name nuvem-supabase;

    ssl_certificate     /etc/nginx/certs/nuvem-supabase.crt;
    ssl_certificate_key /etc/nginx/certs/nuvem-supabase.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        default_type application/json;
        return 200 '{"servico":"nuvem-supabase","papel":"API e storage simulados","status":"ok"}';
    }
}
